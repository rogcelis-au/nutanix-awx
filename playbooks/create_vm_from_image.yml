---
- name: Create VM from Image
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Create VM
      nutanix.ncp.ntnx_vms:
        nutanix_host: "{{ nutanix_host }}"
        nutanix_username: "{{ nutanix_username }}"
        nutanix_password: "{{ nutanix_password }}"
        validate_certs: false

        state: present
        name: RockyVM01

        cluster:
          name: TestCluster4

        vcpus: 1
        cores_per_vcpu: 2
        memory_gb: 4

        networks:
          - is_connected: true
            subnet:
              name: localLAN

        disks:
          - type: DISK
            clone_image:
              name: rhel-9.8-x86_64-boot.iso

      register: vm_create

    - name: Show result
      debug:
        var: vm_create
